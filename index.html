<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>365 Squared</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'IBM Plex Mono',monospace;font-weight:300;background:#fff;color:#111;}
    .wrap{max-width:1440px;margin:0 auto;padding:2rem 2.5rem 6rem;}
    .top-bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.3rem;}
    .site-title{font-size:26px;font-weight:400;letter-spacing:-0.065em;}
    .surprise-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#2563eb;background:none;border:none;cursor:pointer;padding:0;letter-spacing:-0.065em;}
    .surprise-btn:hover{text-decoration:underline;}
    .stats{font-size:12px;color:#888;margin-bottom:1.5rem;letter-spacing:-0.065em;}

    /* search */
    .search-wrap{margin-bottom:1rem;}
    .search-input-row{display:flex;align-items:center;border:none;border-bottom:1px solid #ccc;background:transparent;padding:6px 0;transition:border-color 0.2s;}
    .search-input-row:focus-within{border-bottom-color:#888;}
    .search-input-row input{flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:300;letter-spacing:-0.065em;border:none;background:transparent;color:#111;outline:none;padding:0;min-width:80px;}
    .search-input-row input::placeholder{color:#bbb;}
    .search-pills-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
    .search-pills-row:empty{margin-top:0;}
    .s-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 11px;border-radius:20px;background:#f0f0f0;color:#555;display:flex;align-items:center;gap:5px;letter-spacing:-0.04em;animation:pill-in 0.25s cubic-bezier(0.34,1.4,0.64,1) both;}
    @keyframes pill-in{from{opacity:0;transform:scale(0.7);}to{opacity:1;transform:scale(1);}}
    .s-pill button{background:none;border:none;cursor:pointer;color:#aaa;font-size:11px;padding:0;line-height:1;}
    .s-pill button:hover{color:#111;}

    /* filter section — hidden until search active */
    .filter-section{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease,margin 0.3s ease;margin-top:0;}
    .filter-section.visible{max-height:120px;opacity:1;margin-top:1.25rem;}
    .filter-label{font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:#aaa;margin-bottom:8px;}
    .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
    .ftag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 11px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#666;cursor:pointer;transition:all 0.15s;letter-spacing:-0.04em;}
    .ftag:hover{border-color:#999;color:#111;}
    .ftag.on{background:#111;color:#fff;border-color:#111;}
    .active-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
    .active-pills:empty{margin-bottom:0;}
    .active-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:20px;background:#f0f0f0;color:#555;display:flex;align-items:center;gap:5px;letter-spacing:-0.04em;animation:pill-in 0.25s cubic-bezier(0.34,1.4,0.64,1) both;}
    .active-pill button{background:none;border:none;cursor:pointer;color:#aaa;font-size:11px;padding:0;line-height:1;}
    .active-pill button:hover{color:#111;}

    hr{border:none;border-top:1px solid #e5e5e5;margin-bottom:1.75rem;}

    /* responsive grid */
    .grid{display:grid;gap:28px 24px;grid-template-columns:repeat(4,1fr);}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 16px;}}
    @media(max-width:420px){.grid{grid-template-columns:repeat(1,1fr);}}

    /* cards */
    .card-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative;cursor:pointer;transition:opacity 0.2s;background:#f5f5f5;}
    .card-img:hover{opacity:0.85;}
    .card-img img{display:block;width:100%;height:100%;object-fit:cover;}
    .card-info{margin-top:8px;}
    .card-title{font-size:12px;font-weight:400;color:#111;margin-bottom:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.065em;}
    .card-date{font-size:10px;color:#999;margin-bottom:6px;letter-spacing:-0.065em;}
    .card-pills{display:flex;flex-wrap:wrap;gap:4px;}
    .card-pill{font-size:10px;padding:2px 8px;border-radius:20px;background:#f0f0f0;color:#555;cursor:pointer;letter-spacing:-0.03em;transition:background 0.15s;border:none;font-family:'IBM Plex Mono',monospace;}
    .card-pill:hover{background:#e0e0e0;}
    .no-results{font-size:12px;color:#aaa;padding:3rem 0;text-align:center;display:none;letter-spacing:-0.065em;}

    /* lightbox */
    .lb{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:1000;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background 0.4s cubic-bezier(0.4,0,0.2,1);}
    .lb.open{background:rgba(0,0,0,0.78);pointer-events:all;}
    .lb-inner{position:relative;width:min(480px,88vw);opacity:0;transform:translateY(18px) scale(0.97);transition:opacity 0.4s cubic-bezier(0.4,0,0.2,1),transform 0.4s cubic-bezier(0.34,1.15,0.64,1);}
    .lb.open .lb-inner{opacity:1;transform:translateY(0) scale(1);}
    .lb-close{position:absolute;top:-36px;right:0;background:none;border:none;color:#fff;font-size:14px;cursor:pointer;font-family:'IBM Plex Mono',monospace;opacity:0.6;letter-spacing:-0.065em;transition:opacity 0.2s;}
    .lb-close:hover{opacity:1;}
    .lb-hint{text-align:center;margin-top:12px;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:-0.04em;}

    /* flip card */
    .flip-card{width:100%;aspect-ratio:1;perspective:1200px;cursor:pointer;}
    .flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.85s cubic-bezier(0.22,1.2,0.36,1);will-change:transform;}
    .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
    .flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    .flip-back{transform:rotateY(180deg);}
    .flip-front img,.flip-back img{width:100%;height:100%;display:block;object-fit:cover;}
    .flip-back-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.42);display:flex;flex-direction:column;justify-content:flex-end;padding:1.5rem;}
    .flip-back-title{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:400;color:#fff;margin-bottom:4px;letter-spacing:-0.065em;}
    .flip-back-date{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:10px;letter-spacing:-0.065em;}
    .flip-back-pills{display:flex;flex-wrap:wrap;gap:5px;}
    .flip-back-pill{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.18);color:rgba(255,255,255,0.85);letter-spacing:-0.03em;}
  </style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="site-title">365 Squared</div>
    <button class="surprise-btn" id="surprise-btn">Surprise me!</button>
  </div>
  <div class="stats" id="stats"></div>

  <div class="search-wrap">
    <div class="search-input-row">
      <input type="text" id="search" placeholder="Search by keyword, separate with commas..." autocomplete="off"/>
    </div>
    <div class="search-pills-row" id="search-pills"></div>
  </div>

  <div class="filter-section" id="filter-section">
    <div class="filter-label">Filter by topic</div>
    <div class="filter-row" id="filters"></div>
    <div class="active-pills" id="active-pills"></div>
  </div>

  <hr/>
  <div class="grid" id="grid"></div>
  <div class="no-results" id="no-results">No drawings found.</div>
</div>

<!-- lightbox -->
<div class="lb" id="lb">
  <div class="lb-inner">
    <button class="lb-close" id="lb-close">✕ close</button>
    <div class="flip-card" id="flip-card">
      <div class="flip-inner">
        <div class="flip-front"><img id="lb-front" src="" alt=""/></div>
        <div class="flip-back">
          <img id="lb-back" src="" alt=""/>
          <div class="flip-back-overlay">
            <div class="flip-back-title" id="lb-title"></div>
            <div class="flip-back-date" id="lb-date"></div>
            <div class="flip-back-pills" id="lb-tags"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="lb-hint" id="lb-hint">click the drawing to reveal the back</div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────
  // YOUR DRAWINGS — add one entry per drawing
  // front: path to front scan  e.g. "images/fronts/day-001-front.jpg"
  // back:  path to back scan   e.g. "images/backs/day-001-back.jpg"
  // tags:  pick from your topics list below
  // ─────────────────────────────────────────
  const drawings = [
    { title: "First mark",    date: "1 Jan 2024",  tags: ["Life","Feelings"],           front: "images/fronts/day-001-front.jpg", back: "images/backs/day-001-back.jpg" },
    { title: "Morning fog",   date: "2 Jan 2024",  tags: ["Nature","Heavy"],            front: "images/fronts/day-002-front.jpg", back: "images/backs/day-002-back.jpg" },
    { title: "Red square",    date: "3 Jan 2024",  tags: ["Feelings","Heavy"],          front: "images/fronts/day-003-front.jpg", back: "images/backs/day-003-back.jpg" },
    { title: "Soft grid",     date: "4 Jan 2024",  tags: ["Curiosity","Life"],          front: "images/fronts/day-004-front.jpg", back: "images/backs/day-004-back.jpg" },
    { title: "Blue wash",     date: "5 Jan 2024",  tags: ["Nature","Contentment"],      front: "images/fronts/day-005-front.jpg", back: "images/backs/day-005-back.jpg" },
    // ── keep adding entries below in the same format ──
  ];

  // ─────────────────────────────────────────
  // YOUR TOPICS — edit this list any time
  // ─────────────────────────────────────────
  const TOPICS = ["All","Nature","Feelings","Heavy","Confusion","Happiness","Funny","Enjoyment","Life","Contentment","Curiosity"];

  // ── app state ──
  let confirmedKeywords = [], activeTag = "All";

  function isSearchActive(){
    return confirmedKeywords.length > 0 || document.getElementById("search").value.trim().length > 0;
  }

  function updateFilterVisibility(){
    const section = document.getElementById("filter-section");
    if(isSearchActive()){
      section.classList.add("visible");
    } else {
      section.classList.remove("visible");
      activeTag = "All";
      renderFilters();
      renderActivePills();
    }
  }

  function matches(d){
    const tagOk = activeTag === "All" || d.tags.includes(activeTag);
    if(!tagOk) return false;
    if(!confirmedKeywords.length) return true;
    return confirmedKeywords.every(kw => {
      const k = kw.toLowerCase();
      return d.title.toLowerCase().includes(k) || d.tags.some(t => t.toLowerCase().includes(k));
    });
  }

  function renderSearchPills(){
    const row = document.getElementById("search-pills");
    row.innerHTML = "";
    confirmedKeywords.forEach((kw, i) => {
      const p = document.createElement("div");
      p.className = "s-pill";
      p.innerHTML = `${kw}<button>✕</button>`;
      p.querySelector("button").onclick = () => { confirmedKeywords.splice(i,1); renderSearchPills(); updateFilterVisibility(); render(); };
      row.appendChild(p);
    });
  }

  function renderActivePills(){
    const el = document.getElementById("active-pills");
    el.innerHTML = "";
    if(activeTag !== "All"){
      const p = document.createElement("div");
      p.className = "active-pill";
      p.innerHTML = `${activeTag}<button>✕</button>`;
      p.querySelector("button").onclick = () => { activeTag = "All"; renderFilters(); renderActivePills(); render(); };
      el.appendChild(p);
    }
  }

  function addKeyword(val){
    const v = val.trim();
    if(v && !confirmedKeywords.includes(v)){
      confirmedKeywords.push(v);
      renderSearchPills();
      updateFilterVisibility();
      render();
    }
  }

  document.getElementById("search").addEventListener("keydown", function(e){
    if(e.key === "," || e.key === "Enter"){ e.preventDefault(); addKeyword(this.value.replace(/,/g,"")); this.value = ""; }
    else if(e.key === "Backspace" && this.value === "" && confirmedKeywords.length){ confirmedKeywords.pop(); renderSearchPills(); updateFilterVisibility(); render(); }
  });
  document.getElementById("search").addEventListener("input", function(){
    if(this.value.includes(",")){ const parts = this.value.split(","); parts.slice(0,-1).forEach(p => addKeyword(p)); this.value = parts[parts.length-1]; }
    updateFilterVisibility();
  });

  function openLightbox(d){
    document.getElementById("flip-card").classList.remove("flipped");
    document.getElementById("lb-hint").textContent = "click the drawing to reveal the back";
    document.getElementById("lb-front").src = d.front;
    document.getElementById("lb-front").alt = d.title + " — front";
    document.getElementById("lb-back").src = d.back;
    document.getElementById("lb-back").alt = d.title + " — back";
    document.getElementById("lb-title").textContent = d.title;
    document.getElementById("lb-date").textContent = d.date;
    document.getElementById("lb-tags").innerHTML = d.tags.map(t => `<span class="flip-back-pill">${t}</span>`).join("");
    document.getElementById("lb").classList.add("open");
  }

  function closeLb(){ document.getElementById("lb").classList.remove("open"); }

  function render(){
    const filtered = drawings.filter(matches);
    document.getElementById("stats").textContent = `${drawings.length} drawings · Year One · ${filtered.length} shown`;
    document.getElementById("no-results").style.display = filtered.length === 0 ? "block" : "none";
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    filtered.forEach(d => {
      const wrap = document.createElement("div");
      const imgDiv = document.createElement("div");
      imgDiv.className = "card-img";
      const img = document.createElement("img");
      img.src = d.front;
      img.alt = d.title;
      img.loading = "lazy";
      imgDiv.appendChild(img);
      imgDiv.onclick = () => openLightbox(d);
      const info = document.createElement("div");
      info.className = "card-info";
      const pills = d.tags.map(t => `<button class="card-pill" data-tag="${t}">${t}</button>`).join("");
      info.innerHTML = `<div class="card-title">${d.title}</div><div class="card-date">${d.date}</div><div class="card-pills">${pills}</div>`;
      info.querySelectorAll(".card-pill").forEach(el => el.addEventListener("click", () => { activeTag = el.dataset.tag; renderFilters(); renderActivePills(); render(); }));
      wrap.appendChild(imgDiv); wrap.appendChild(info);
      grid.appendChild(wrap);
    });
  }

  function renderFilters(){
    const bar = document.getElementById("filters");
    bar.innerHTML = "";
    TOPICS.forEach(t => {
      const b = document.createElement("button");
      b.className = "ftag" + (activeTag === t ? " on" : "");
      b.textContent = t;
      b.onclick = () => { activeTag = t; renderFilters(); renderActivePills(); render(); };
      bar.appendChild(b);
    });
  }

  document.getElementById("flip-card").addEventListener("click", function(){
    const wasFlipped = this.classList.contains("flipped");
    this.classList.toggle("flipped");
    document.getElementById("lb-hint").textContent = wasFlipped ? "click the drawing to reveal the back" : "click again to flip back";
  });
  document.getElementById("lb").addEventListener("click", e => { if(e.target === document.getElementById("lb")) closeLb(); });
  document.getElementById("lb-close").addEventListener("click", closeLb);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeLb(); });
  document.getElementById("surprise-btn").addEventListener("click", () => {
    const visible = drawings.filter(matches);
    if(visible.length) openLightbox(visible[Math.floor(Math.random() * visible.length)]);
  });

  renderFilters(); render();
</script>
</body>
</html>
